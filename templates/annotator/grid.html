{% extends "base.html" %}
{% block title %}My Images{% endblock %}
{% block header_title %}My Images{% endblock %}

{% block content %}
<div class="container">
    <!-- Stats + action -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <div id="statsInfo" style="font-size:0.84rem; font-weight:500; color:#555;">Loading...</div>
        <a href="{{ url_for('annotator.annotate') }}" class="btn btn-primary">Start Annotating</a>
    </div>

    <!-- Stat cards -->
    <div class="stat-grid" style="margin-bottom:20px;">
        <div class="stat-card">
            <div class="label">Pending</div>
            <div class="value muted" id="statPending">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Annotated</div>
            <div class="value amber" id="statAnnotated">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Junior Approved</div>
            <div class="value muted" id="statJuniorApproved">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Final Approved</div>
            <div class="value green" id="statApproved">—</div>
        </div>
    </div>

    <div class="progress-bar-container" style="margin-bottom:28px;">
        <div class="progress-bar-fill" id="progressBar" style="width:0%;"></div>
    </div>

    <!-- Pending work section -->
    <div style="margin-bottom:32px;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
            <h2 style="font-size:1rem; font-weight:600; margin:0;">Pending Work</h2>
            <span id="pendingCount" style="font-size:0.8rem; color:#888;"></span>
        </div>
        <div class="image-grid" id="pendingGrid">
            <p style="color:#bbb; padding:20px;">Loading...</p>
        </div>
    </div>

    <!-- Completed section -->
    <div>
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
            <h2 style="font-size:1rem; font-weight:600; margin:0;">Submitted for Review</h2>
            <span id="doneCount" style="font-size:0.8rem; color:#888;"></span>
        </div>
        <div class="image-grid" id="doneGrid">
            <p style="color:#bbb; padding:20px;">Loading...</p>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/grid.js') }}"></script>
<script>
    const BASE_URL = '{{ url_for("annotator.grid_data") }}';

    const pendingGrid = new ImageGrid('pendingGrid', {
        fetchUrl: BASE_URL + '?status=pending_work',
        onClick: (imageId) => { window.location = `/annotator/annotate/${imageId}`; }
    });

    const doneGrid = new ImageGrid('doneGrid', {
        fetchUrl: BASE_URL + '?status=completed',
        onClick: (imageId) => { window.location = `/annotator/annotate/${imageId}`; }
    });

    async function loadGrid() {
        try {
            const resp = await fetch(BASE_URL);
            const data = await resp.json();

            document.getElementById('statsInfo').textContent =
                `Total: ${data.total} · Pending: ${data.pending} · Done: ${data.done}`;
            document.getElementById('pendingCount').textContent = `(${data.pending})`;
            document.getElementById('doneCount').textContent = `(${data.done})`;

            document.getElementById('statPending').textContent = data.pending;
            document.getElementById('statAnnotated').textContent = data.cnt_annotated;
            document.getElementById('statJuniorApproved').textContent = data.cnt_junior_approved;
            document.getElementById('statApproved').textContent = data.cnt_approved;

            const pct = data.total > 0 ? ((data.done / data.total) * 100).toFixed(1) : 0;
            document.getElementById('progressBar').style.width = pct + '%';

            pendingGrid.load(1);
            doneGrid.load(1);
        } catch (e) {
            document.getElementById('pendingGrid').innerHTML =
                '<p style="padding:20px; color:#dc2626;">Failed to load images.</p>';
        }
    }

    loadGrid();
</script>
{% endblock %}
