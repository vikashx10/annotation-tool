{% extends "base.html" %}
{% block title %}My Images{% endblock %}
{% block header_title %}My Images{% endblock %}

{% block content %}
<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <div id="statsInfo" style="font-size:0.84rem; font-weight:500; color:#555;">Loading...</div>
        <a href="{{ url_for('annotator.annotate') }}" class="btn btn-primary">Start Annotating</a>
    </div>

    <div class="progress-bar-container" style="margin-bottom:20px;">
        <div class="progress-bar-fill" id="progressBar" style="width:0%;"></div>
    </div>

    <div class="image-grid" id="gridContainer">
        <p style="color:#bbb; padding:20px;">Loading...</p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/grid.js') }}"></script>
<script>
    const grid = new ImageGrid('gridContainer', {
        fetchUrl: '{{ url_for("annotator.grid_data") }}',
        onClick: (imageId) => { window.location = `/annotator/annotate/${imageId}`; }
    });

    async function loadGrid() {
        try {
            const resp = await fetch('{{ url_for("annotator.grid_data") }}');
            const data = await resp.json();

            document.getElementById('statsInfo').textContent =
                `Total: ${data.total} · Pending: ${data.pending} · Done: ${data.done}`;

            const pct = data.total > 0 ? ((data.done / data.total) * 100).toFixed(1) : 0;
            const bar = document.getElementById('progressBar');
            bar.style.width = pct + '%';

            grid.render(data.images, data);
        } catch (e) {
            document.getElementById('gridContainer').innerHTML =
                '<p style="padding:20px; color:#dc2626;">Failed to load images.</p>';
        }
    }

    loadGrid();
</script>
{% endblock %}
