{% extends "base.html" %}
{% block title %}Annotate{% endblock %}
{% block header_title %}Annotate{% endblock %}

{% block head %}
{% if image_id %}
<link rel="preload" href="/api/image/{{ image_id }}" as="image">
{% endif %}
{% endblock %}

{% block content %}
<div class="annotate-layout">

    <!-- Canvas area -->
    <div class="annotate-canvas-area">
        <div class="annotate-toolbar">
            <button id="drawModeBtn" onclick="toggleDraw()">
                Draw <span class="shortcut">D</span>
            </button>
            <span class="divider"></span>
            <button class="btn-primary" onclick="saveAndNext()" id="saveNextBtn">
                Save &amp; Next <span class="shortcut">S</span>
            </button>
            <button onclick="saveOnly()">Save</button>
            <span class="divider"></span>
            <button onclick="goPrev()" id="prevBtn">&larr; Prev</button>
            <button onclick="goNext()" id="nextBtn">Next &rarr;</button>
            <span class="divider"></span>
            <span id="progressInfo" style="font-size:0.78rem; color:#888;"></span>
            <div style="flex:1;"></div>
            <a href="{{ url_for('annotator.grid') }}" class="btn btn-secondary btn-sm">Grid View</a>
        </div>
        <div class="canvas-scroll">
            <div class="canvas-wrapper">
                <canvas id="annotationCanvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="annotate-sidebar">
        <div class="sidebar-section">
            <h4>Image</h4>
            <div class="sidebar-meta" id="imageInfo">Loading...</div>
        </div>
        <div class="sidebar-section" style="display:flex; align-items:center; justify-content:space-between;">
            <h4 style="margin:0;">Annotations</h4>
            <span id="annCount" style="font-size:0.78rem; color:#999; font-weight:500;"></span>
        </div>
        <div class="ann-list" id="annList"></div>
    </div>
</div>

<!-- Class selector modal -->
<div class="overlay" id="overlay"></div>
<div class="class-selector" id="classSelector">
    <h3>Select class</h3>
    <div class="class-selector-buttons" id="classButtons"></div>
    <div style="margin-top:12px; display:flex; gap:8px;">
        <button class="btn-danger btn-sm" onclick="doClearRegion()">Clear Region</button>
        <button class="btn-secondary btn-sm" onclick="ac.cancelDrawing()">Cancel</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/canvas.js') }}"></script>
<script>
    const CLASS_NAMES = {{ class_names | tojson }};
    const CLASS_COLORS = [
        '#1f77b4', '#ff7f0e', '#2ca02c', '#00b894', '#9467bd', '#8c564b',
        '#e377c2', '#7f7f7f', '#bcbd22', '#17becf', '#ff1493', '#00ced1',
        '#d62728', '#8b008b',
    ];

    let currentImageId = {{ image_id | tojson }};

    const ac = new AnnotationCanvas('annotationCanvas', {
        classNames: CLASS_NAMES,
        classColors: CLASS_COLORS,
        readOnly: false,
        onSave: async (imageId, annotations) => {
            const resp = await fetch(`/api/annotations/${imageId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ annotations })
            });
            if (!resp.ok) throw new Error('Save failed');
        },
        onAnnotationsChanged: () => { updateInfo(); renderAnnList(); }
    });

    // ── Prefetch cache ──────────────────────────────────────────────────────
    // Maps imageId → { imgElement: HTMLImageElement, annotations: [] }
    // Null value means "fetch in progress".
    const _cache = new Map();
    const CACHE_MAX = 3; // keep at most N entries to limit memory

    async function _prefetch(imageId) {
        if (!imageId || _cache.has(imageId)) return;
        _cache.set(imageId, null); // mark in-progress

        try {
            // Fetch annotations and image bytes in parallel
            const [annResp, imgResp] = await Promise.all([
                fetch(`/api/annotations/${imageId}`),
                fetch(`/api/image/${imageId}`),   // follows presigned-URL redirect
            ]);
            const annotations = await annResp.json();
            const blob = await imgResp.blob();
            const blobUrl = URL.createObjectURL(blob);

            await new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    _cache.set(imageId, { imgElement: img, annotations, blobUrl });
                    resolve();
                };
                img.onerror = () => {
                    URL.revokeObjectURL(blobUrl);
                    _cache.delete(imageId);
                    reject();
                };
                img.src = blobUrl;
            });
        } catch (e) {
            _cache.delete(imageId); // allow retry on next opportunity
        }

        // Evict oldest entries beyond CACHE_MAX
        if (_cache.size > CACHE_MAX) {
            const oldest = _cache.keys().next().value;
            const entry = _cache.get(oldest);
            if (entry && entry.blobUrl) URL.revokeObjectURL(entry.blobUrl);
            _cache.delete(oldest);
        }
    }

    async function _kickPrefetch(afterId) {
        try {
            const resp = await fetch(`/api/peek_next?current_id=${afterId}`);
            const data = await resp.json();
            if (data.next_image_id) _prefetch(data.next_image_id);
        } catch (e) {}
    }
    // ───────────────────────────────────────────────────────────────────────

    function toggleDraw() {
        const on = ac.toggleDrawMode();
        const btn = document.getElementById('drawModeBtn');
        btn.innerHTML = on
            ? `Stop Drawing <span class="shortcut">D</span>`
            : `Draw <span class="shortcut">D</span>`;
        btn.classList.toggle('draw-active', on);
    }

    function doClearRegion() {
        const count = ac.clearRegion();
        if (count > 0) showToast(`Removed ${count} annotation(s)`, 'success');
        else showToast('No annotations in region', 'error');
    }

    function renderAnnList() {
        const anns = ac.getAnnotations();
        const list = document.getElementById('annList');
        const countEl = document.getElementById('annCount');
        countEl.textContent = anns.length ? `(${anns.length})` : '';
        if (!anns.length) {
            list.innerHTML = '<div style="padding:16px;color:#bbb;font-size:0.82rem;text-align:center;">No annotations yet</div>';
            return;
        }
        list.innerHTML = anns.map((a, i) => `
            <div class="ann-item">
                <span class="ann-color" style="background:${CLASS_COLORS[a.class_id % CLASS_COLORS.length]};"></span>
                <span class="ann-label">${CLASS_NAMES[a.class_id] || 'Class ' + a.class_id}</span>
                <button class="ann-remove" onclick="ac.removeAnnotation(${i})" title="Remove">&times;</button>
            </div>
        `).join('');
    }

    function updateInfo() {
        const count = ac.getAnnotationCount();
        document.getElementById('imageInfo').innerHTML = currentImageId
            ? `<strong>ID:</strong> ${currentImageId}<br><strong>Boxes:</strong> ${count}`
            : 'No image loaded';
        if (currentImageId) fetchMeta(currentImageId);
    }

    async function fetchMeta(imageId) {
        try {
            const r = await fetch(`/api/image_meta/${imageId}`);
            const m = await r.json();
            const el = document.getElementById('imageInfo');
            let html = `<strong>ID:</strong> ${imageId}<br><strong>Boxes:</strong> ${ac.getAnnotationCount()}`;
            html += `<br><strong>Status:</strong> <span class="badge badge-${m.status}">${m.status}</span>`;
            if (m.annotated_at) html += `<br><strong>Annotated:</strong> ${new Date(m.annotated_at).toLocaleString()}`;
            if (m.reviewed_at) html += `<br><strong>Reviewed:</strong> ${new Date(m.reviewed_at).toLocaleString()}`;
            el.innerHTML = html;
        } catch(e) {}
    }

    async function loadImage(imageId) {
        if (!imageId) {
            document.getElementById('imageInfo').textContent = 'No more images!';
            document.getElementById('saveNextBtn').disabled = true;
            return;
        }
        currentImageId = imageId;

        const cached = _cache.get(imageId);
        if (cached) {
            // Instant render from prefetch cache — no network wait
            ac.loadFromCache(imageId, cached.imgElement, cached.annotations);
            updateInfo();
            renderAnnList();
            history.replaceState(null, '', `/annotator/annotate/${imageId}`);
            _kickPrefetch(imageId);
            return;
        }

        // Cache miss — normal load, then start prefetching next
        try {
            await ac.loadImage(imageId);
            updateInfo();
            renderAnnList();
            history.replaceState(null, '', `/annotator/annotate/${imageId}`);
            _kickPrefetch(imageId);
        } catch (e) {
            showToast('Failed to load image', 'error');
        }
    }

    async function saveOnly() {
        if (!currentImageId) return;
        const ok = await ac.save();
        if (ok) showToast('Saved!', 'success');
        else showToast('Save failed', 'error');
    }

    async function saveAndNext() {
        if (!currentImageId) return;
        document.getElementById('saveNextBtn').disabled = true;
        try {
            const resp = await fetch('/api/save_and_next', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image_id: currentImageId,
                    annotations: ac.getAnnotations()
                })
            });
            const data = await resp.json();
            if (data.status === 'ok') {
                showToast('Saved!', 'success');
                await loadImage(data.next_image_id);
            } else {
                showToast(data.message || 'All done!', 'success');
                document.getElementById('imageInfo').innerHTML = '<strong>All images annotated!</strong>';
                document.getElementById('saveNextBtn').disabled = true;
                return;
            }
            loadProgress();
        } catch (e) {
            showToast('Error: ' + e.message, 'error');
        } finally {
            if (currentImageId) document.getElementById('saveNextBtn').disabled = false;
        }
    }

    async function goNext() {
        if (!currentImageId) return;
        try {
            const resp = await fetch(`/api/navigate_annotator?current_id=${currentImageId}&direction=next`);
            const data = await resp.json();
            if (data.image_id) await loadImage(data.image_id);
            else showToast('No next image', 'error');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function goPrev() {
        if (!currentImageId) return;
        try {
            const resp = await fetch(`/api/navigate_annotator?current_id=${currentImageId}&direction=prev`);
            const data = await resp.json();
            if (data.image_id) await loadImage(data.image_id);
            else showToast('No previous image', 'error');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function loadProgress() {
        try {
            const resp = await fetch('/annotator/progress');
            const data = await resp.json();
            const pct = data.total > 0 ? ((data.done / data.total) * 100).toFixed(1) : 0;
            document.getElementById('progressInfo').textContent =
                `${data.done} / ${data.total} (${pct}%)`;
        } catch (e) {}
    }

    document.addEventListener('keydown', async function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'd' || e.key === 'D') {
            toggleDraw();
        } else if (e.key === 's' || e.key === 'S') {
            e.preventDefault();
            await saveAndNext();
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            await goNext();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            await goPrev();
        }
    });

    loadImage(currentImageId);
    loadProgress();
</script>
{% endblock %}
